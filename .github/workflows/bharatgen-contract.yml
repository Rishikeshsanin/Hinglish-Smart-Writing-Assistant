name: BharatGen contract CPU checks (NO pretrained weights)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/indicwrite/param_rewrite.py'
      - 'tests/test_param_runtime_contract.py'
      - 'requirements-bharatgen.txt'
      - '.github/workflows/bharatgen-contract.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bharatgen-contract.yml'
      - 'src/indicwrite/param_rewrite.py'
      - 'tests/test_param_runtime_contract.py'

jobs:
  runtime-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU stack, never model weights
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-bharatgen.txt pytest==8.4.2
          python -m pip check
      - name: Execute mocked BharatGen contract tests, no real inference claim
        run: python -m pytest -q tests/test_param_runtime_contract.py tests/test_param_rewrite.py
