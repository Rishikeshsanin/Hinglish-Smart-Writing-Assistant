name: Real Streamlit + IndicXlit browser QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/browser-qa.yml']

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install official model and browser dependencies
        run: |
          python -m pip install 'pip==23.3.2' 'setuptools<70' wheel
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run real Streamlit app, interact and screenshot
        run: |
          python -m streamlit run app.py --server.headless=true --server.address=127.0.0.1 --server.port=8501 >/tmp/indicwrite-streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true; tail -n 50 /tmp/indicwrite-streamlit.log' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          python scripts/browser_smoke.py
      - name: Upload actual application screenshots
        uses: actions/upload-artifact@v4
        with:
          name: indicwrite-actual-browser-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified real screenshots only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f screenshots/desktop.png screenshots/mobile.png screenshots/browser-qa.json
          git diff --cached --exit-code && exit 0
          git commit -m "test(ui): record real desktop and mobile IndicWrite screenshots"
          git push origin HEAD:main
