name: Verify pip-only Streamlit Community Cloud host environment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements-local.txt'
      - '.python-version'
      - 'cloud_app.py'
      - 'tests/test_cloud_venv_isolation.py'
      - '.github/workflows/cloud-env.yml'
jobs:
  cloud-host:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exactly the Streamlit host requirements using pip
        run: |
          python -m pip install -r requirements.txt
          python - <<'PY'
          import sys, streamlit
          print('PIP_ONLY_STREAMLIT_HOST', sys.version, streamlit.__version__)
          assert sys.version_info[:2] == (3, 12)
          PY
      - name: Assert original-model dependency isolation and valid cloud launcher
        run: |
          python -m pip install pytest
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q tests/test_cloud_venv_isolation.py tests/test_cloud_entrypoint.py
