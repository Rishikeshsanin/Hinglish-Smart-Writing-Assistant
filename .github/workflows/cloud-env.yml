name: Verify clean Conda-only Streamlit Python 3.12 environment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'environment.yml'
      - 'cloud_app.py'
      - 'src/indicwrite/fairseq_compat_loader.py'
      - '.github/workflows/cloud-env.yml'
jobs:
  cloud-env:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: indicwrite-community
          environment-file: environment.yml
          auto-activate-base: false
          miniforge-version: latest
          use-mamba: true
      - name: Verify pure Conda Streamlit environment (model installed separately)
        run: |
          python - <<'PY'
          import sys, streamlit, pip
          assert sys.version_info[:2] == (3, 12)
          print('CONDA_BASE_ONLY',sys.version,streamlit.__version__,pip.__version__)
          PY
          # Actual checkpoint installation, smoke and 40-case parity run in
          # cloud-isolated-venv.yml: pip23 is never installed into this prefix.
