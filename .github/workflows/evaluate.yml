name: Genuine IndicXlit 40-case evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/evaluate.yml']

permissions:
  contents: write

jobs:
  evaluate-real-model:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install official IndicXlit dependencies
        run: |
          python -m pip install 'pip==23.3.2' 'setuptools<70' wheel
          python -m pip install -r requirements.txt
      - name: Verify real neural inference
        run: python scripts/smoke_indicxlit.py
      - name: Generate 40 real predictions and metrics
        run: python evaluation/evaluate.py
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicwrite-real-model-40-case-evaluation
          path: evaluation/results/
          if-no-files-found: error
          retention-days: 30
      - name: Commit actual evaluated output only (no model weights)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f evaluation/results/metrics.json evaluation/results/predictions.csv evaluation/results/worst_cases.csv
          git diff --cached --exit-code && exit 0
          git commit -m "data: record 40 actual IndicXlit predictions and evaluation"
          git push origin HEAD:main
