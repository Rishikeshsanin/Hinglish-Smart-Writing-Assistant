name: Hindi GEC candidate quality comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gec-compare.yml'
      - 'scripts/gec_candidate_compare.py'

jobs:
  check-genuine-output:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Install runtime
        run: |
          python -m pip install torch 'transformers>=4.44,<5' sentencepiece protobuf safetensors
      - name: Execute genuine candidate inference
        env:
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
        run: python scripts/gec_candidate_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: genuine-hindi-gec-candidate-comparison
          path: gec-candidate-evidence.json
          if-no-files-found: error
          retention-days: 30
