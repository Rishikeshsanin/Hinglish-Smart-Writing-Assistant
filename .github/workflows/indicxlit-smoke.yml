name: Genuine IndicXlit model smoke (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/indicxlit-smoke.yml', 'src/indicwrite/engine.py']

jobs:
  real-model:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install official AI4Bharat package
        run: |
          python -m pip install 'pip==23.3.2' 'setuptools<70' wheel
          python -m pip install -r requirements.txt
      - name: Run genuine IndicXlit inference
        run: python scripts/smoke_indicxlit.py
