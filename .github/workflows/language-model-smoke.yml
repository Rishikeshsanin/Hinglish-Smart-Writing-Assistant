name: Genuine Hindi grammar + English translation model smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/language-model-smoke.yml'
      - 'src/indicwrite/language_services.py'
      - 'scripts/smoke_language_models.py'

jobs:
  real-models:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install isolated optional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.3,<3' -r requirements-language-services.txt
      - name: Generate real Hindi correction and English translation
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
        run: python scripts/smoke_language_models.py
