name: Public Streamlit live IndicXlit conversion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud_app.py'
      - 'environment.yml'
      - 'scripts/check_public_streamlit.py'
      - '.github/workflows/public-streamlit-smoke.yml'

jobs:
  public-live-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Open actual public website and convert Roman Hindi
        run: python scripts/check_public_streamlit.py
      - name: Keep independent public screenshot (pass or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indicwrite-public-qa-screenshot
          path: public-indicwrite.png
          if-no-files-found: ignore
          retention-days: 7
