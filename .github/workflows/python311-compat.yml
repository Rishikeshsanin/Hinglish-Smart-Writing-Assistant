name: Genuine IndicXlit compatibility on supported Python 3.11
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/python311-compat.yml']
jobs:
  python311:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documented legacy IndicXlit package in fresh Python 3.11
        run: |
          python -m pip install 'pip==23.3.2' 'setuptools<70' wheel
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Execute genuine official IndicXlit 3.11 smoke and measure process RSS
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python scripts/smoke_indicxlit.py
          python scripts/benchmark_indicxlit.py
      - uses: actions/upload-artifact@v4
        with:
          name: indicxlit-python311-real-model-compatibility
          path: evaluation/results/indicxlit-resource-probe.json
          if-no-files-found: error
