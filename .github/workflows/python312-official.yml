name: Experimental official IndicXlit on supported Python 3.12
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/indicwrite/engine.py'
      - 'src/indicwrite/fairseq_compat_loader.py'
      - 'tests/test_compat_loader.py'
      - 'scripts/verify_py312_official_parity.py'
      - '.github/workflows/python312-official.yml'
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned CPU packages and legacy model dependencies
        run: |
          python -m pip install 'pip==23.3.2' 'setuptools<70' wheel
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install 'codemix-restore-shunyalabs==0.4.0' --no-deps
          python -m pip install pytest
      - name: Run compatibility guard regression tests
        run: python -m pytest -q tests/test_compat_loader.py
      - name: Run 40 cases with actual official weights and exact historical parity
        env:
          INDICWRITE_PY312_COMPAT: '1'
          OMP_NUM_THREADS: '2'
        run: python scripts/verify_py312_official_parity.py
