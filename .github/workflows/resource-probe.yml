name: Genuine IndicXlit memory and latency capacity probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/resource-probe.yml','scripts/benchmark_indicxlit.py']
jobs:
  measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: |
          python -m pip install 'pip==23.3.2' 'setuptools<70' wheel
          python -m pip install -r requirements-local.txt
      - name: Execute real pretrained inference and record RAM/latency
        run: python scripts/benchmark_indicxlit.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-indicxlit-memory-latency
          path: evaluation/results/indicxlit-resource-probe.json
          if-no-files-found: error
          retention-days: 45
