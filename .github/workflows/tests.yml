name: Unit tests (no model)
on:
  push:
    branches: [main, 'lead/**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m compileall -q app.py src scripts evaluation
