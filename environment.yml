# Streamlit Community Cloud ONLY. Compatible with Python 3.12 based on
# executed GitHub Actions run 41210696882 (40/40 identical genuine predictions).
# Keep requirements.txt unchanged for the proven Python 3.10 local demo.
name: indicwrite-community
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip=25.3
  - setuptools<70
  - wheel
  - pip:
      - streamlit>=1.42,<2
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.6.0+cpu
      - torchaudio==2.6.0+cpu
      - ai4bharat-transliteration==1.1.3
      - codemix-restore-shunyalabs==0.4.0
